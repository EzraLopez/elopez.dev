<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05060e" />
  <link rel="icon" href="data:," />
  <title>elopez.dev</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05060e;
      --ink: #f5f5f5;
      --muted: #bcc0ca;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--ink);
      color: var(--bg);
    }

    /* ---- Animated spiral-field backdrop ---- */
    #universe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
      cursor: grab;
      touch-action: pan-y;
    }
    #universe:active { cursor: grabbing; }

    /* Soft legibility veil: darker behind the type, clear over the sky */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(100deg, rgba(5, 6, 14, 0.55) 0%, rgba(5, 6, 14, 0.26) 40%, rgba(5, 6, 14, 0.02) 70%, rgba(5, 6, 14, 0.14) 100%),
        linear-gradient(to top, rgba(5, 6, 14, 0.40) 0%, rgba(5, 6, 14, 0) 26%),
        radial-gradient(120% 90% at 50% 50%, rgba(5, 6, 14, 0) 55%, rgba(3, 4, 9, 0.48) 100%);
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(100%, 1200px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(26px, env(safe-area-inset-top)) clamp(22px, 5vw, 64px) max(26px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .intro {
      width: min(680px, 100%);
      animation: rise 700ms cubic-bezier(.22, .61, .36, 1) both;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 7.5vw, 5.75rem);
      font-weight: 560;
      letter-spacing: -0.045em;
      line-height: 1.02;
      text-wrap: balance;
      text-shadow:
        0 0 18px rgba(5, 6, 14, 0.80),
        0 2px 34px rgba(5, 6, 14, 0.60),
        0 0 64px rgba(5, 6, 14, 0.42);
    }

    h1 span {
      display: block;
    }

    .lede {
      max-width: 30rem;
      margin: 30px 0 0;
      font-size: clamp(1.125rem, 1.02rem + 0.45vw, 1.375rem);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: -0.011em;
      color: var(--muted);
      text-shadow:
        0 0 12px rgba(5, 6, 14, 0.88),
        0 1px 24px rgba(5, 6, 14, 0.72),
        0 0 48px rgba(5, 6, 14, 0.48);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      main {
        align-items: center;
        padding: 0;
      }
      h1 {
        font-size: clamp(3.1rem, 15.5vw, 4.6rem);
        line-height: 1.04;
      }
      .lede { margin-top: 24px; }
      .veil {
        background:
          linear-gradient(to bottom, rgba(5, 6, 14, 0.26) 0%, rgba(5, 6, 14, 0.08) 34%, rgba(5, 6, 14, 0.18) 62%, rgba(5, 6, 14, 0.42) 100%),
          radial-gradient(120% 90% at 50% 50%, rgba(5, 6, 14, 0) 55%, rgba(3, 4, 9, 0.48) 100%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="universe" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <div class="page">
    <main>
      <section class="intro" aria-labelledby="headline">
        <h1 id="headline">Ideas, <span>built.</span></h1>
        <p class="lede">Experiments, apps, and useful things for the internet.</p>
      </section>
    </main>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('universe');
      var ctx = canvas.getContext('2d');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var W = 0, H = 0, DPR = 1;
      var CX = 0, CY = 0, R = 300;         // spiral field centre + radius
      var QX = 0, QY = 0, QRX = 0, QRY = 0; // quiet zone: feathered ellipse behind the text
      var SQUASH = 0.87;                    // gentle axial tilt, opened up a touch
      var spiral = [];                      // stars that form the galaxy
      var field = [];                       // distant background stars

      // Rotation state. Canvas angles grow clockwise on screen, so the
      // stately counterclockwise spin of the reference is a negative rate:
      // a quarter-turn (~1.57 rad) every ~75 s -> full turn in ~5 min.
      var BASE_RATE = -(Math.PI * 2) / 300; // rad per second
      var rotation = 0;                     // integrated field angle
      var spinBoost = 0;                    // drag inertia / key spin, decays

      // Intro: scattered stars spiral inward and coalesce
      var INTRO_LEN = 2600;                 // ms of travel per star
      var INTRO_STAGGER = 700;              // ms of per-star delay spread
      var startTime = performance.now();
      var lastNow = startTime;

      /* Quiet zone: brightness multiplier for a point — lowest at the
         centre of the text block, feathering smoothly back to 1 (full
         brightness) at and beyond the ellipse edge. No hard boundary. */
      function quietFactor(x, y, minFactor) {
        if (!QRX || !QRY) return 1;
        var dx = (x - QX) / QRX;
        var dy = (y - QY) / QRY;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d >= 1) return 1;
        var s = d * d * (3 - 2 * d);       // smoothstep feather
        return minFactor + (1 - minFactor) * s;
      }

      function updateQuietZone() {
        var intro = document.querySelector('.intro');
        if (!intro) return;
        var r = intro.getBoundingClientRect();
        if (!r.width || !r.height) return;
        QX = r.left + r.width / 2;
        QY = r.top + r.height / 2;
        QRX = r.width / 2 + Math.min(120, W * 0.15);
        QRY = r.height / 2 + Math.min(95, H * 0.12);
      }

      function rand(min, max) { return min + Math.random() * (max - min); }
      function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
      function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

      /* ---------- Pre-rendered indigo nebula texture ---------- */
      var nebula = document.createElement('canvas');
      (function buildNebula() {
        nebula.width = 1024; nebula.height = 1024;
        var n = nebula.getContext('2d');
        var blobs = [
          { x: 0.24, y: 0.30, r: 0.52, c: '40, 52, 110',  a: 0.30 },
          { x: 0.70, y: 0.62, r: 0.58, c: '26, 36, 92',   a: 0.28 },
          { x: 0.55, y: 0.22, r: 0.36, c: '62, 50, 104',  a: 0.18 },
          { x: 0.86, y: 0.16, r: 0.30, c: '70, 62, 110',  a: 0.10 },
          { x: 0.14, y: 0.78, r: 0.40, c: '22, 48, 86',   a: 0.18 },
          { x: 0.44, y: 0.88, r: 0.34, c: '30, 38, 88',   a: 0.22 }
        ];
        blobs.forEach(function (b) {
          var g = n.createRadialGradient(b.x * 1024, b.y * 1024, 0, b.x * 1024, b.y * 1024, b.r * 1024);
          g.addColorStop(0, 'rgba(' + b.c + ',' + b.a + ')');
          g.addColorStop(0.55, 'rgba(' + b.c + ',' + (b.a * 0.45) + ')');
          g.addColorStop(1, 'rgba(' + b.c + ',0)');
          n.fillStyle = g;
          n.fillRect(0, 0, 1024, 1024);
        });
      })();

      /* Soft radial glow sprite for the brightest stars */
      var glowSprite = document.createElement('canvas');
      (function buildGlow() {
        glowSprite.width = 64; glowSprite.height = 64;
        var g = glowSprite.getContext('2d');
        var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(225,233,255,0.55)');
        grad.addColorStop(0.4, 'rgba(200,214,250,0.16)');
        grad.addColorStop(1, 'rgba(200,214,250,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 64, 64);
      })();

      function pickColor() {
        var p = Math.random();
        if (p < 0.07) return '196,150,220';  // faint purple / magenta dust
        if (p < 0.15) return '255,226,178';  // warm amber, sparse
        if (p < 0.38) return '238,242,250';  // white
        return '186,206,255';                // blue-white, the dominant arm light
      }

      /* ---------- Build the spiral field ---------- */
      function buildField() {
        spiral = [];
        field = [];
        var portrait = W < 760;
        CX = W * (portrait ? 0.58 : 0.53);
        CY = H * (portrait ? 0.56 : 0.45);
        R = Math.min(Math.max(W * 0.72, H * 0.44, 280), 1120);

        var count = Math.min(3800, Math.floor(W * H / 300));
        var ARMS = 3;
        for (var i = 0; i < count; i++) {
          var arm = i % ARMS;
          var t = Math.pow(Math.random(), 0.78);        // denser toward core
          var ang = arm * (Math.PI * 2 / ARMS) + t * 2.35 + gauss() * (0.17 + t * 0.38);
          var rad = Math.pow(t, 0.9) * R;
          var coreStar = t < 0.13;
          var spread = 6 + t * R * 0.21;                // wide arms, diffusing as they unwind
          spiral.push({
            ang: ang,
            rad: rad,
            px: gauss() * spread,
            py: gauss() * spread,
            r: coreStar ? rand(0.5, 1.3) : rand(0.4, 1.5) * (1 - t * 0.35),
            base: rand(0.26, 0.88) * (coreStar ? 0.9 : 1),
            twSpeed: rand(0.3, 1.3),
            twPhase: rand(0, Math.PI * 2),
            col: pickColor(),
            // intro scatter: start far out, wound further around the spiral
            scatterRad: rad * rand(1.5, 2.7) + rand(20, 130),
            scatterAng: rand(1.4, 3.4) + (1 - t) * 1.2,
            delay: Math.random() * INTRO_STAGGER
          });
        }

        // Distant field stars: stored in polar form around the same centre
        // so the entire sky turns together, just more slowly.
        var fCount = Math.min(850, Math.floor(W * H / 2400));
        for (var j = 0; j < fCount; j++) {
          var fx = Math.random() * W - CX;
          var fy = (Math.random() * H - CY) / SQUASH;
          field.push({
            ang: Math.atan2(fy, fx),
            rad: Math.sqrt(fx * fx + fy * fy),
            r: rand(0.4, 1.4),
            base: rand(0.25, 0.85),
            twSpeed: rand(0.3, 1.2),
            twPhase: rand(0, Math.PI * 2),
            col: pickColor()
          });
        }
      }

      function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        buildField();
        updateQuietZone();
        if (reduced) drawFrame(startTime + INTRO_LEN + INTRO_STAGGER + 1);
      }

      /* ---------- Core: dense glow + soft cross-flare ---------- */
      function drawCore(introE) {
        var coreR = R * 0.30 * (0.7 + 0.3 * introE);
        // Soften the core glow where it sits behind the text block
        var coreDim = quietFactor(CX, CY, 0.52);
        ctx.save();
        ctx.translate(CX, CY);
        ctx.scale(1, SQUASH);
        ctx.globalCompositeOperation = 'lighter';

        var glow = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
        glow.addColorStop(0, 'rgba(255,246,228,' + (0.85 * introE * coreDim).toFixed(3) + ')');
        glow.addColorStop(0.18, 'rgba(226,222,248,' + (0.42 * introE * coreDim).toFixed(3) + ')');
        glow.addColorStop(0.5, 'rgba(150,164,220,' + (0.13 * introE * coreDim).toFixed(3) + ')');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, coreR, 0, Math.PI * 2);
        ctx.fill();

        // Soft cross-flare: stretched radial gradients, no hard edges
        function flare(len, thick, alpha) {
          ctx.save();
          ctx.scale(1, thick / len);
          var fg = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
          fg.addColorStop(0, 'rgba(232,238,255,' + alpha.toFixed(3) + ')');
          fg.addColorStop(0.5, 'rgba(232,238,255,' + (alpha * 0.38).toFixed(3) + ')');
          fg.addColorStop(1, 'rgba(232,238,255,0)');
          ctx.fillStyle = fg;
          ctx.beginPath();
          ctx.arc(0, 0, len, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        flare(coreR * 1.45, coreR * 0.13, 0.16 * introE * coreDim);
        ctx.save();
        ctx.rotate(Math.PI / 2);
        flare(coreR * 1.05, coreR * 0.13, 0.11 * introE * coreDim);
        ctx.restore();
        ctx.restore();
      }

      function drawFrame(now) {
        var elapsed = now - startTime;
        ctx.clearRect(0, 0, W, H);

        // Near-black base with a dark blue / indigo cast
        var base = ctx.createLinearGradient(0, 0, 0, H);
        base.addColorStop(0, '#04050c');
        base.addColorStop(0.55, '#05060e');
        base.addColorStop(1, '#030409');
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, W, H);

        // Nebula wash, barely drifting
        var nebScale = Math.max(W, H) * 1.7;
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.drawImage(nebula,
          CX - nebScale / 2 + Math.sin(elapsed * 0.000016) * 22,
          CY - nebScale / 2 + Math.cos(elapsed * 0.000013) * 18,
          nebScale, nebScale);
        ctx.restore();

        // Overall intro progress for the core
        var introGlobal = reduced ? 1 : easeOutCubic(Math.min(elapsed / (INTRO_LEN + INTRO_STAGGER), 1));

        // Distant field stars — whole sky turning together, slower
        var fieldRot = rotation * 0.35;
        for (var j = 0; j < field.length; j++) {
          var f = field[j];
          var fa = f.ang + fieldRot;
          var fx = CX + Math.cos(fa) * f.rad;
          var fy = CY + Math.sin(fa) * f.rad * SQUASH;
          if (fx < -4 || fx > W + 4 || fy < -4 || fy > H + 4) continue;
          var ftw = 0.74 + 0.26 * Math.sin(elapsed * 0.001 * f.twSpeed + f.twPhase);
          ctx.fillStyle = 'rgba(' + f.col + ',' + (f.base * ftw * introGlobal * quietFactor(fx, fy, 0.52)).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(fx, fy, f.r, 0, Math.PI * 2);
          ctx.fill();
        }

        drawCore(introGlobal);

        // Spiral arm stars
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < spiral.length; i++) {
          var s = spiral[i];
          var e, rad, ang;
          if (reduced) {
            e = 1; rad = s.rad; ang = s.ang;
          } else {
            var local = (elapsed - s.delay) / INTRO_LEN;
            local = local < 0 ? 0 : (local > 1 ? 1 : local);
            e = easeOutCubic(local);
            rad = s.scatterRad + (s.rad - s.scatterRad) * e;
            ang = s.ang + s.scatterAng * (1 - e);   // unwinds as it falls in
          }
          var a = ang + rotation;
          var x = CX + Math.cos(a) * rad + s.px;
          var y = CY + Math.sin(a) * rad * SQUASH + s.py;
          if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
          var tw = 0.76 + 0.24 * Math.sin(elapsed * 0.001 * s.twSpeed + s.twPhase);
          var alpha = s.base * tw * (0.15 + 0.85 * e) * quietFactor(x, y, 0.44);
          ctx.fillStyle = 'rgba(' + s.col + ',' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(x, y, s.r, 0, Math.PI * 2);
          ctx.fill();
          if (s.r > 1.35) {
            var gs = s.r * 8;
            ctx.globalAlpha = alpha * 0.55;
            ctx.drawImage(glowSprite, x - gs / 2, y - gs / 2, gs, gs);
            ctx.globalAlpha = 1;
          }
        }
        ctx.restore();
      }

      function loop(now) {
        var dt = Math.min((now - lastNow) / 1000, 0.05);
        lastNow = now;
        spinBoost *= Math.pow(0.12, dt);            // inertia decays fast but smooth
        rotation += (BASE_RATE + spinBoost + keySpin) * dt;
        drawFrame(now);
        requestAnimationFrame(loop);
      }

      /* ---------- Interaction: drag to rotate, arrow keys too ---------- */
      var dragging = false, dragPointerAng = 0, dragMoved = 0, lastDragT = 0;
      var keySpin = 0;

      function pointerAngle(e) {
        return Math.atan2((e.clientY - CY) / SQUASH, e.clientX - CX);
      }
      function angleDelta(a, b) {
        var d = a - b;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return d;
      }

      canvas.addEventListener('pointerdown', function (e) {
        dragging = true;
        dragMoved = 0;
        dragPointerAng = pointerAngle(e);
        lastDragT = performance.now();
        spinBoost = 0;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var a = pointerAngle(e);
        var d = angleDelta(a, dragPointerAng);
        dragPointerAng = a;
        rotation += d;
        dragMoved += Math.abs(d);
        var now = performance.now();
        var dt = Math.max((now - lastDragT) / 1000, 0.008);
        spinBoost = spinBoost * 0.6 + (d / dt) * 0.4;   // release keeps the spin
        lastDragT = now;
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        // A tap (barely any angular travel) near the centre gives the
        // field a little spin in its natural counterclockwise direction.
        if (!reduced && e && e.type === 'pointerup' && dragMoved < 0.03) {
          var dx = e.clientX - CX;
          var dy = (e.clientY - CY) / SQUASH;
          var tapR = Math.max(120, R * 0.3);
          if (dx * dx + dy * dy < tapR * tapR) {
            spinBoost = Math.max(spinBoost - 2.0, -4.5);
          }
        }
      }
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);

      window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { keySpin = -0.30; e.preventDefault(); }
        else if (e.key === 'ArrowRight') { keySpin = 0.30; e.preventDefault(); }
      });
      window.addEventListener('keyup', function (e) {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keySpin = 0;
      });

      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', function () {
        lastNow = performance.now();
      });

      resize();
      // Re-measure once the intro rise has settled so the quiet zone
      // centres on the text block's resting position.
      setTimeout(updateQuietZone, 900);
      if (!reduced) requestAnimationFrame(loop);
    })();
  </script>

  <script data-goatcounter="https://elopez.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
